apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-manager
  labels:
    app: student-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-manager
  template:
    metadata:
      labels:
        app: student-manager
    spec:
      containers:
        - name: student-manager
          image: student-manager:1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "96Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
